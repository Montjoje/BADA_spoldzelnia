<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title>Mieszkańcy</title>
    <link th:rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css} "/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
    <div class="container">
        <a class="navbar-brand" href="/">Spring Boot projekt - część II</a>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link">
                        Zalogowany jako
                        <b style="color:lightskyblue"
                           sec:authentication="principal.username"></b>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-link nav-link" type="submit">
                            Wyloguj się
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="table-responsive">

    <!-- TABLE -->
    <label style="font-size:25px">
        <b>Mieszkańcy</b>
    </label>

    <table class="table">
        <thead>
        <tr>
            <th>Nr mieszkańca</th>
            <th>Imię</th>
            <th>Nazwisko</th>
            <th>PESEL</th>
            <th>Wiek</th>
            <th>Stan cywilny</th>
            <th>Płeć</th>
            <th>Numer kontaktowy</th>
            <th>Nr lokalu (FK)</th>
            <th>Password</th>
            <th colspan="2">Akcje</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="m : ${mieszkancyList}">
            <form th:action="@{/admin/mieszkancy/updateMieszkancy}"
                  th:object="${m}"
                  method="post">

                <td>
                    <input type="text"
                           name="nrMieszkanca"
                           th:value="${m.nrMieszkanca}"
                           readonly/>
                </td>

                <td>
                    <input type="text"
                           name="imieMieszkanca"
                           th:value="${m.imieMieszkanca}"/>
                </td>

                <td>
                    <input type="text"
                           name="nazwiskoMieszkanca"
                           th:value="${m.nazwiskoMieszkanca}"/>
                </td>

                <td>
                    <input type="text"
                           name="pesel"
                           th:value="${m.pesel}"/>
                </td>

                <td>
                    <input type="text"
                           name="wiek"
                           th:value="${m.wiek}"/>
                </td>

                <td>
                    <input type="text"
                           name="stanCywilny"
                           th:value="${m.stanCywilny}"/>
                </td>

                <td>
                    <input type="text"
                           name="plec"
                           th:value="${m.plec}"/>
                </td>

                <td>
                    <input type="text"
                           name="numerKontaktowy"
                           th:value="${m.numerKontaktowy}"/>
                </td>

                <td>
                    <input type="text"
                           name="nrLokalu"
                           th:value="${m.nrLokalu}"/>
                </td>
                <td>
                    <input type="text"
                           name="password"
                           th:value="${m.password}"/>
                </td>

                <td>
                    <button class="btn btn-primary" type="submit">Zapisz</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <a class="btn btn-danger"
                       th:href="@{'/admin/mieszkancy/deleteMieszkancy/' + ${m.nrMieszkanca}}">
                        Usuń
                    </a>
                </td>

            </form>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/admin/mieszkancy/saveMieszkancy}"
          th:object="${mieszkancy}"
          method="post">

        <table class="table">
            <tr>
                <td>Imię</td>
                <td>
                    <input type="text"
                           th:field="*{imieMieszkanca}">
                </td>

                <td>Nazwisko</td>
                <td>
                    <input type="text"
                           th:field="*{nazwiskoMieszkanca}">
                </td>

                <td>PESEL</td>
                <td>
                    <input type="text"
                           th:field="*{pesel}">
                </td>

                <td>Wiek</td>
                <td>
                    <input type="text"
                           th:field="*{wiek}">
                </td>

                <td>Stan cywilny</td>
                <td>
                    <label style="width: 100px">
                        <input type="radio" name="stanCywilny" value="wolny/a">
                        wolny/a
                    </label>

                    <label style="width: 100px">
                        <input type="radio" name="stanCywilny" value="zamezny/a">
                        zamezny/a
                    </label>
                </td>

                <td>Płeć</td>
                <td>
                    <label style="width: 50px">
                        <input type="radio" name="plec" value="M">
                        M
                    </label>

                    <label style="width: 50px">
                        <input type="radio" name="plec" value="K">
                        K
                    </label>
                </td>

                <td>Numer kontaktowy</td>
                <td>
                    <input type="text"
                           th:field="*{numerKontaktowy}">
                </td>

                <td>Nr lokalu</td>
                <td>
                    <input type="text"
                           th:field="*{nrLokalu}">
                </td>
                <td>Password</td>
                <td>
                    <input type="text"
                           th:field="*{password}">
                </td>

                <td colspan="2">
                    <button class="btn btn-primary" type="submit">
                        Dodaj
                    </button>
                </td>
            </tr>
        </table>
    </form>
</div>
<a href="/admin/admin_main">Strona admina</a>

</body>
</html>
