<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title>Klatki</title>
    <link th:rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css} "/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
    <div class="container">
        <a class="navbar-brand" href="/">Spring Boot projekt - część II</a>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link">
                        Zalogowany jako
                        <b style="color:lightskyblue"
                           sec:authentication="principal.username"></b>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-link nav-link" type="submit">
                            Wyloguj się
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="table-responsive">

    <!-- TABLE -->
    <label style="font-size:25px">
        <b>Klatki</b>
    </label>

    <table class="table">
        <thead>
        <tr>
            <th>Numer klatki</th>
            <th>Numer w budynku</th>
            <th>Liczba wind</th>
            <th>Numer budynku (FK)</th>
            <th colspan="2">Akcje</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="sp : ${klatkiList}">
            <form th:action="@{/admin/klatki/updateKlatki}" th:object="${sp}" method="post">
                <td><label>
                    <input type="text" name="nrKlatki" th:value="${sp.nrKlatki}" readonly/>
                </label></td>
                <td><label>
                    <input type="text" name="numerWBudynku" th:value="${sp.numerWBudynku}"/>
                </label></td>
                <td><label>
                    <input type="text" name="liczbaWind" th:value="${sp.liczbaWind}"/>
                </label></td>
                <td><label>
                    <input type="text" name="nrBudynku" th:value="${sp.nrBudynku}"/>
                </label></td>
                <td>
                    <button class="btn btn-primary" type="submit">Zapisz</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <a class="btn btn-danger" th:href="@{'/admin/klatki/deleteKlatki/' + ${sp.nrKlatki}}">Usuń</a>
                </td>
            </form>
        </tr>
        </tbody>
    </table>
</div>

<form action="/" th:action="@{/admin/klatki/saveKlatki}" th:object="${klatki}" method="post">
    <!-- Table -->
    <table class="table">
        <tr>
            <td>Numer w budynku</td>
            <td><label>
                <input type="text" size="10" class="narrow-font" th:field="*{numerWBudynku}">
            </label></td>
            <td>Liczba wind</td>
            <td><label>
                <input type="text" size="10" class="narrow-font" th:field="*{liczbaWind}">
            </label></td>
            <td>Numer budynku</td>
            <td><label>
                <input type="text" size="10" class="narrow-font" th:field="*{nrBudynku}">
            </label></td>

            <td colspan="2">
                <button class="btn btn-primary" type="submit">Dodaj</button>
            </td>
        </tr>
    </table>
</form>
<a href="/admin/admin_main">Strona admina</a>
</body>
</html>
