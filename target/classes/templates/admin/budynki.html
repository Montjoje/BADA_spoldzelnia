<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title>Budynki</title>
    <link th:rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css} "/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
    <div class="container">
        <a class="navbar-brand" href="/">Spring Boot projekt - część II</a>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link">
                        Zalogowany jako
                        <b style="color:lightskyblue"
                           sec:authentication="principal.username"></b>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-link nav-link" type="submit">
                            Wyloguj się
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="table-responsive">

    <!-- TABLE -->
    <label style="font-size:25px">
        <b>Budynki</b>
    </label>

    <table class="table">
        <thead>
        <tr>
            <th>Nr budynku</th>
            <th>Liczba pięter</th>
            <th>Numer spółdzielni</th>
            <th>Numer adresu</th>
            <th>Miasto</th>
            <th>Ulica</th>
            <th>Numer budynku</th>
            <th>Numer lokalu</th>
            <th>Kod pocztowy</th>
            <th colspan="2">Akcje</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="sp : ${budynkiList}">
            <form th:action="@{/admin/budynki/updateBudynki}" th:object="${sp}" method="post">
                <td><label>
                    <input type="text" name="nrBudynku" th:value="${sp.nrBudynku}" readonly/>
                </label></td>
                <td><label>
                    <input type="text" name="liczbaPieter" th:value="${sp.liczbaPieter}"/>
                </label></td>
                <td><label>
                    <input type="text" name="nrSpoldzielni" th:value="${sp.nrSpoldzielni}"/>
                </label></td>
                <td><label>
                    <input type="text" name="numerAdresu" th:value="${sp.numerAdresu}" readonly/>
                </label></td>
                <td><label>
                    <input type="text" name="miasto" th:value="${sp.miasto}"/>
                </label></td>
                <td><label>
                    <input type="text" name="ulica" th:value="${sp.ulica}"/>
                </label></td>
                <td><label>
                    <input type="text" name="numerBudynku" th:value="${sp.numerBudynku}"/>
                </label></td>
                <td><label>
                    <input type="text" name="numerLokalu" th:value="${sp.numerLokalu}"/>
                </label></td>
                <td><label>
                    <input type="text" name="kodPocztowy" th:value="${sp.kodPocztowy}"/>
                </label></td>
                <td>
                    <button class="btn btn-primary" type="submit">Zapisz</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <a class="btn btn-danger" th:href="@{'/admin/budynki/deleteBudynki/' + ${sp.nrBudynku}}">Usuń</a>
                </td>
            </form>
        </tr>
        </tbody>
    </table>

    <form action="/" th:action="@{/admin/budynki/saveBudynki}" th:object="${budynki}" method="post">
        <!-- Table -->
        <table class="table">
            <tr>
                <td>Liczba pięter</td>
                <td><label>
                    <input type="text" size="10" class="narrow-font" th:field="*{liczbaPieter}">
                </label></td>
                <td>Numer spółdzielni</td>
                <td><label>
                    <input type="text" size="10" class="narrow-font" th:field="*{nrSpoldzielni}">
                </label></td>
                <td>Miasto</td>
                <td><label>
                    <input type="text" size="10" class="narrow-font" th:field="*{miasto}">
                </label></td>
                <td>Ulica</td>
                <td><label>
                    <input type="text" size="10" class="narrow-font" th:field="*{ulica}">
                </label></td>
                <td>Numer budynku</td>
                <td><label>
                    <input type="text" size="10" class="narrow-font" th:field="*{numerBudynku}">
                </label></td>
                <td>Numer lokalu</td>
                <td><label>
                    <input type="text" size="10" class="narrow-font" th:field="*{numerLokalu}">
                </label></td>
                <td>Kod pocztowy</td>
                <td><label>
                    <input type="text" size="10" class="narrow-font" th:field="*{kodPocztowy}" maxlength="6">
                </label></td>
                <td colspan="2">
                    <button class="btn btn-primary" type="submit">Dodaj</button>
                </td>
            </tr>
        </table>
    </form>
</div>
<a href="/admin/admin_main">Strona admina</a>
</body>
</html>
