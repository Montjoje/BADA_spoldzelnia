<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title>Adresy email</title>
    <link th:rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css} "/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
    <div class="container">
        <a class="navbar-brand" href="/">Spring Boot projekt - część II</a>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link">
                        Zalogowany jako
                        <b style="color:lightskyblue"
                           sec:authentication="principal.username"></b>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-link nav-link" type="submit">
                            Wyloguj się
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="table-responsive">

    <!-- TABLE -->
    <label style="font-size:25px">
        <b>Adresy email</b>
    </label>

    <table class="table">
        <thead>
        <tr>
            <th>Numer adresu email</th>
            <th>Adres email</th>
            <th>Numer pracownika (FK)</th>
            <th>Numer mieszkańca (FK)</th>
            <th colspan="2">Akcje</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="ae : ${adresyEmailList}">
            <form th:action="@{/admin/adresyEmail/updateAdresyEmail}"
                  th:object="${ae}"
                  method="post">

                <td>
                    <input type="text"
                           name="nrAdrEmail"
                           th:value="${ae.nrAdrEmail}"
                           readonly/>
                </td>

                <td>
                    <input type="text"
                           name="adresEmail"
                           th:value="${ae.adresEmail}"/>
                </td>

                <td>
                    <input type="text"
                           name="nrPracownika"
                           th:value="${ae.nrPracownika}"/>
                </td>

                <td>
                    <input type="text"
                           name="nrMieszkanca"
                           th:value="${ae.nrMieszkanca}"/>
                </td>

                <td>
                    <button class="btn btn-primary" type="submit">Zapisz</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <a class="btn btn-danger"
                       th:href="@{'/admin/adresyEmail/deleteAdresyEmail/' + ${ae.nrAdrEmail}}">
                        Usuń
                    </a>
                </td>

            </form>
        </tr>
        </tbody>
    </table>
</div>

<form action="/" th:action="@{/admin/adresyEmail/saveAdresyEmail}"
      th:object="${adresyEmail}"
      method="post">

    <table class="table">
        <tr>
            <td>Adres email</td>
            <td>
                <input type="text"
                       size="20"
                       class="narrow-font"
                       th:field="*{adresEmail}">
            </td>

            <td>Numer pracownika</td>
            <td>
                <input type="text"
                       size="10"
                       class="narrow-font"
                       th:field="*{nrPracownika}">
            </td>

            <td>Numer mieszkańca</td>
            <td>
                <input type="text"
                       size="10"
                       class="narrow-font"
                       th:field="*{nrMieszkanca}">
            </td>

            <td colspan="2">
                <button class="btn btn-primary" type="submit">
                    Dodaj
                </button>
            </td>
        </tr>
    </table>
</form>

<a href="/admin/admin_main">Strona admina</a>

</body>
</html>
